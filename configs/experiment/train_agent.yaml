# @package _global_
# Train one agent for config.episodes episodes, then evaluate its policy on the comparison
# set over `eval_seeds` fresh episodes. Writes metrics/train_agent-<agent>.json.
experiment:
  _target_: autotsaugment.components.experiments.train_agent.TrainAgentExperiment
  name: train_agent
  eval_seeds: [0, 1, 2]
  checkpoint_dir: checkpoints/${experiment.name}
