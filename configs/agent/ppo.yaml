# PPO from TorchRL. On-policy: second agent, for comparison with SAC.
_target_: autotsaugment.components.agents.torchrl.ppo.PPOAgent
device: ${device}
config:
  _target_: autotsaugment.components.agents.torchrl.ppo.PPOAgentConfig
  episodes: 200
  hidden_sizes: [256, 256]
  learning_rate: 3e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coef: 0.01
  episodes_per_update: 4
  ppo_epochs: 10
  minibatch_size: 64
