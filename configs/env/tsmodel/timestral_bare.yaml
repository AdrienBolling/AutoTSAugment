# Timestral-5M architecture, random init, trained from scratch every episode.
_target_: autotsaugment.components.tsmodel.timestral.TimestralBare
_partial_: true   # the environment builds K instances
device: ${device}
episode_epochs: ${env.config.episode.epochs}
config:
  _target_: autotsaugment.components.tsmodel.timestral.TimestralBareConfig
  context_length: 768
  horizon_length: 256
  batch_size: 128
  learning_rate: 1e-3
  weight_decay: 0.01
  grad_clip: 1.0
  mixed_precision: true
  compile: true    # 2.8x faster per epoch; about 17 s of cold compile per process
  warmup_fraction: 0.05  # linear warmup over this share of the episode steps
  min_lr_fraction: 0.1   # cosine decay ends at this share of the peak learning rate
  architecture:   # mistralai/Timestral-5M config.json, 2026-10-15
    patch_size: 32
    d_model: 192
    num_heads: 3
    mlp_hidden_dim: 512
    block_schedule: [time, time, time, time_variate, time, time, time, time_variate]
    quantile_knots: [0.01, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 0.99]
    block_size: 32
    context_length: 32768
    rope_theta: 10000.0
    rope_partial_factor: 0.5
    norm_eps: 1.0e-6
    attn_bias: false
    mlp_bias: false
    time_attn_gate: sdpa_sigmoid
    variate_attn_gate: sdpa_sigmoid
    minimum_scale: 1.0e-6
    use_asinh: true
    stabilize_with_global: false
    covariate_enabled: true
    split_context_horizon_attn: true
    attend_missing_patches: true
    quantile_width_factor: 3.0
