# Every GIFT-Eval "<name>/<freq>" (47 of 55) that has a window in both splits, over the seven
# domains: 1173.5 MB of shards, inside the 10 GB budget. The comments give the shard size and the
# reward / comparison windows built with the values below (measured 2026-10-23).
# Left out: the 8 ids with an empty split. Every split of every series stays inside its part of
# the series (last 10% never read, then 85% reward, 15% comparison), and these series are too
# short for one window (a window needs `season` observed context steps plus one horizon):
#   - electricity/W                  #   0.32 MB, length 208: empty comparison split
#   - solar/W                        #   0.03 MB, length  52: empty reward split
#   - hospital/M                     #   0.28 MB, length  84: empty comparison split
#   - covid_deaths/D                 #   0.23 MB, length 212: empty comparison split
#   - car_parts_with_missing/M       #   0.62 MB, length  51: empty comparison split
#   - hierarchical_sales/W           #   0.13 MB, length 260: empty comparison split
#   - ett1/W                         #   0.00 MB, length 103: empty comparison split
#   - ett2/W                         #   0.00 MB, length 103: empty comparison split
# Download first: uv run python scripts/download_benchmarks.py --config configs/env/benchmark/gifteval_full.yaml
_target_: autotsaugment.components.data.gifteval.GiftEvalBenchmark
device: ${device}
config:
  _target_: autotsaugment.components.data.gifteval.GiftEvalBenchmarkConfig
  root: data/gifteval
  repo_id: Salesforce/GiftEval
  max_total_gb: 10.0
  datasets:
    # Econ/Fin
    - m4_yearly/A                       #     4.07 MB, 512 / 512 windows
    - m4_quarterly/Q                    #    10.34 MB, 512 / 512 windows
    - m4_monthly/M                      #    46.24 MB, 512 / 512 windows
    - m4_weekly/W                       #     1.50 MB, 512 / 512 windows
    - m4_daily/D                        #    40.20 MB, 512 / 512 windows
    - m4_hourly/H                       #     1.50 MB, 512 / 512 windows
    # Energy
    - electricity/15T                   #   207.59 MB, 512 / 512 windows
    - electricity/H                     #    51.91 MB, 512 / 512 windows
    - electricity/D                     #     2.17 MB, 512 / 512 windows
    - solar/10T                         #    28.81 MB, 512 / 512 windows
    - solar/H                           #     4.81 MB, 512 / 512 windows
    - solar/D                           #     0.20 MB, 512 / 137 windows
    - ett1/15T                          #     1.95 MB, 512 / 512 windows
    - ett1/H                            #     0.49 MB, 512 / 336 windows
    - ett1/D                            #     0.02 MB, 126 /  21 windows
    - ett2/15T                          #     1.95 MB, 512 / 512 windows
    - ett2/H                            #     0.49 MB, 512 / 336 windows
    - ett2/D                            #     0.02 MB, 126 /  21 windows
    # Healthcare
    - us_births/D                       #     0.03 MB, 186 /  32 windows
    - us_births/M                       #     0.00 MB,  14 /   1 windows
    - us_births/W                       #     0.01 MB,  93 /  11 windows
    # Nature
    - saugeenday/D                      #     0.10 MB, 512 / 106 windows
    - saugeenday/M                      #     0.00 MB,  48 /   7 windows
    - saugeenday/W                      #     0.01 MB, 317 /  50 windows
    - temperature_rain_with_missing/D   #    93.88 MB, 512 / 512 windows
    - kdd_cup_2018_with_missing/H       #    11.78 MB, 512 / 512 windows
    - kdd_cup_2018_with_missing/D       #     0.50 MB, 512 / 254 windows
    - jena_weather/10T                  #     4.43 MB, 512 / 512 windows
    - jena_weather/H                    #     0.74 MB, 512 / 504 windows
    - jena_weather/D                    #     0.03 MB, 189 /  21 windows
    # Sales
    - restaurant/D                      #     1.19 MB, 512 / 512 windows
    - hierarchical_sales/D              #     0.87 MB, 512 / 512 windows
    # Transport
    - LOOP_SEATTLE/5T                   #   135.82 MB, 512 / 512 windows
    - LOOP_SEATTLE/H                    #    11.33 MB, 512 / 512 windows
    - LOOP_SEATTLE/D                    #     0.48 MB, 512 / 323 windows
    - SZ_TAXI/15T                       #     1.86 MB, 512 / 512 windows
    - SZ_TAXI/H                         #     0.47 MB, 512 / 156 windows
    - M_DENSE/H                         #    16.82 MB, 512 / 512 windows
    - M_DENSE/D                         #     0.70 MB, 512 /  90 windows
    # Web/CloudOps
    - bitbrains_fast_storage/5T         #   302.48 MB, 512 / 512 windows
    - bitbrains_fast_storage/H          #    25.31 MB, 512 / 512 windows
    - bitbrains_rnd/5T                  #   120.99 MB, 512 / 512 windows
    - bitbrains_rnd/H                   #    10.11 MB, 512 / 512 windows
    - bizitobs_application/10S          #     1.31 MB, 266 /  34 windows
    - bizitobs_service/10S              #    26.72 MB, 512 / 512 windows
    - bizitobs_l2c/5T                   #     1.15 MB, 512 / 512 windows
    - bizitobs_l2c/H                    #     0.10 MB, 287 /  49 windows
  reward_windows_per_dataset: 512
  comparison_windows_per_dataset: 512
  reward_fraction: 0.85
  stride_in_horizons: 1
  seed: 0
