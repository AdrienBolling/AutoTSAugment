# Every GIFT-Eval "<name>/<freq>" (44 of 55) with at least min_windows_per_split = 32 valid
# windows in both splits, over the seven domains: 1174.1 MB of shards, inside the 10 GB budget.
# The comments give the shard size and the reward / comparison windows kept with the values
# below (measured 2026-10-23 at the pinned revision).
# The last 10% of each series is never read; the rest is 85% reward, 15% comparison. The
# horizon of a window lies inside its split; a comparison context may read the end of the
# reward split (comparison_context_may_cross).
# Left out, empty split: the series are too short for one horizon in the split.
#   - solar/W                        #   0.03 MB, length  52: empty reward split
#   - covid_deaths/D                 #   0.23 MB, length 212: empty comparison split (29 steps < horizon 30)
#   - car_parts_with_missing/M       #   0.62 MB, length  51: empty comparison split (7 steps < horizon 12)
# Left out, fewer than 32 valid windows (reward / comparison):
#   - us_births/M                    #   0.00 MB,  14 /   2 windows
#   - us_births/W                    #   0.01 MB,  93 /  17 windows
#   - saugeenday/M                   #   0.00 MB,  48 /   8 windows
#   - ett1/D                         #   0.02 MB, 126 /  21 windows
#   - ett1/W                         #   0.00 MB,  21 /   7 windows
#   - ett2/D                         #   0.02 MB, 126 /  21 windows
#   - ett2/W                         #   0.00 MB,  21 /   7 windows
#   - jena_weather/D                 #   0.03 MB, 189 /  21 windows
# Download first: uv run python scripts/download_benchmarks.py --config configs/env/benchmark/gifteval_full.yaml
_target_: autotsaugment.components.data.gifteval.GiftEvalBenchmark
device: ${device}
config:
  _target_: autotsaugment.components.data.gifteval.GiftEvalBenchmarkConfig
  root: data/gifteval
  repo_id: Salesforce/GiftEval
  revision: 30841734ac5cfddbd0c3bad6d09d2b6b32becbb0  # main on 2026-10-23
  max_total_gb: 10.0
  datasets:
    # Econ/Fin
    - m4_yearly/A                       #     4.07 MB, 512 / 512 windows
    - m4_quarterly/Q                    #    10.34 MB, 512 / 512 windows
    - m4_monthly/M                      #    46.24 MB, 512 / 512 windows
    - m4_weekly/W                       #     1.50 MB, 512 / 512 windows
    - m4_daily/D                        #    40.20 MB, 512 / 512 windows
    - m4_hourly/H                       #     1.50 MB, 512 / 512 windows
    # Energy
    - electricity/15T                   #   207.59 MB, 512 / 512 windows
